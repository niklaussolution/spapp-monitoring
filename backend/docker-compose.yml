version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: spapp-postgres
    environment:
      POSTGRES_DB: spapp_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - spapp_pg_data:/var/lib/postgresql/data

volumes:
  spapp_pg_data:
